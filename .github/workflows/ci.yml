name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build HushtypeCore for iOS
        # The iPhone and iPad keyboard depends on HushtypeCore; keep it building there.
        run: xcodebuild build -scheme HushtypeCore -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Package app bundle
        run: scripts/build-app.sh release
      - name: Zip app
        run: ditto -c -k --keepParent dist/Hushtype.app dist/Hushtype.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Hushtype-app
          path: dist/Hushtype.zip
